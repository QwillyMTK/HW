<h2>Список постов</h2>
<ul>
    {% for post in posts %}
        <li>
            <a href="{% url 'post_detail' post.pk %}">{{ post.title }}</a>
            ({{ post.category.name }})
        </li>
    {% endfor %}
</ul>
<a href="{% url 'post_create' %}">Создать пост</a> |
<a href="{% url 'category_create' %}">Создать категорию</a>
